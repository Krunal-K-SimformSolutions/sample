min_version: 1.0.0

pre-commit:
  parallel: true
  commands:
    lint-fix:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn eslint --fix {staged_files}

    prettier:
      glob: '*.{js,ts,jsx,tsx,md,json,yml}'
      run: yarn prettier --write {staged_files}

    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn eslint {staged_files}

    typescript:
      glob: '*.{ts,tsx}'
      run: yarn tsc --noEmit

    spelling:
      glob: '**/*.{js,ts,jsx,tsx,md,json,yml}'
      run: yarn cspell {staged_files}

pre-push:
  parallel: true
  commands:
    packages-audit:
      run: yarn npm audit

    test:
      run: yarn test

commit-msg:
  parallel: true
  commands:
    spell-check:
      run: yarn cspell --no-summary {1}
  scripts:
    msg_checker.sh:
      runner: bash
